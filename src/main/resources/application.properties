spring.application.name=atlas-waypoint-backend

# Postgres (valores por defecto = docker-compose.yml; sobrescribir con variables de entorno)
spring.r2dbc.url=${WAYPOINT_R2DBC_URL:r2dbc:postgresql://localhost:5434/waypoint}
spring.r2dbc.username=${POSTGRES_USER:waypoint}
spring.r2dbc.password=${POSTGRES_PASSWORD:change-me}

# Liquibase usa JDBC solo al arrancar; el resto del acceso a datos es R2DBC
spring.liquibase.url=${WAYPOINT_JDBC_URL:jdbc:postgresql://localhost:5434/waypoint}
spring.liquibase.user=${POSTGRES_USER:waypoint}
spring.liquibase.password=${POSTGRES_PASSWORD:change-me}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Errores RFC 7807 (ProblemDetail)
spring.webflux.problemdetails.enabled=true
